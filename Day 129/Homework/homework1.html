<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="homework1.css">
</head>
<body>
    <header>
        <img src="homework1 imgs/Amazon-logo.png" alt="">
    </header>

    <main>
        <div class="watches">
            <img class="black" src="homework1 imgs/black.png" alt="Black Smartwatch">
            <img class="hidden blue" src="homework1 imgs/blue.png" alt="Blue Smartwatch">
            <img class="hidden pink" src="homework1 imgs/pink.png" alt="Pink Smartwatch">
            <img class="hidden purple" src="homework1 imgs/purple.png" alt="Purple Smartwatch">
            <img class="hidden red" src="homework1 imgs/red.png" alt="Red Smartwatch">
            <p class="para1 hide"></p>
            <img class="heart" src="homework1 imgs/heart.png" alt="">
        </div>

        <div class="parent">
            <div class="child1">
                <h1>Fitbit 19 - The Smartest Watch</h1>
                <p>Lorem, ipsum dolor sit amet consectetur  adipisicing elit. <br> Repellat aperiam amet</p>
            </div>

            <div class="child2">
                <p>Select Color</p>

                <div class="color-parent">
                    <div class="colors color1" id="black">
                        
                    </div>

                    <div class="colors color2" id="red">

                    </div>

                    <div class="colors color3" id="blue">

                    </div>

                    <div class="colors color4" id="purple">

                    </div>

                    <div class="colors color5" id="pink">

                    </div>

                </div>
            </div>

            <div class="child3">
                <h3>Features</h3>
                <div class="buttons">
                    <button class="button1">Time</button>
                    <button class="button2">Heart Rate</button>
                </div>
                <button class="button3">BUY NOW!</button>
            </div>
        </div>
    </main>

    <script src="homework1.js">

    </script>
</body>
</html>
