<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Calculator app</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="parent">
      <div class="first-parent">
        <h1>0</h1>
      </div>

      <div class="second-parent">
        <div class="buttons nums">
          <h3>7</h3>
        </div>

        <div class="buttons nums">
          <h3>8</h3>
        </div>

        <div class="buttons nums">
          <h3>9</h3>
        </div>

        <div class="buttons del">
          <h3>DEL</h3>
        </div>

        <div class="buttons nums">
          <h3>4</h3>
        </div>

        <div class="buttons nums">
          <h3>5</h3>
        </div>

        <div class="buttons nums">
          <h3>6</h3>
        </div>

        <div class="buttons operators">
          <h3>+</h3>
        </div>

        <div class="buttons nums">
          <h3>1</h3>
        </div>

        <div class="buttons nums">
          <h3>2</h3>
        </div>

        <div class="buttons nums">
          <h3>3</h3>
        </div>

        <div class="buttons operators">
          <h3>-</h3>
        </div>

        <div class="buttons dot">
          <h3>.</h3>
        </div>

        <div class="buttons nums">
          <h3>0</h3>
        </div>

        <div class="buttons operators">
          <h3>/</h3>
        </div>

        <div class="buttons operators">
          <h3>X</h3>
        </div>

        <div class="res">
          <h3>reset</h3>
        </div>

        <div class="total">
          <h3>=</h3>
        </div>
      </div>
  </div>
  
  <script src="script.js">

  </script>
</body>
</html>
