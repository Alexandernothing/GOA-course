<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="homework1.css">
</head>
<body>
    <div class="parent">
        <h1>Register With Us</h1>

        <form>
            <div class="inps">
                <label for="">Username</label>
                <input type="text" name="username" id="" placeholder="Enter username">
                <span class="name-errors"></span>
            </div>

            <div class="inps">
                <label for="">Email</label>
                <input type="text" name="email" id="" placeholder="Enter email">
                <span class="email-errors"></span>
            </div>
            
            <div class="inps">
                <label for="">Password</label>
                <input type="text" name="pass" id="" placeholder="Enter password">
                <span class="pass-errors"></span>
            </div>

            <div class="inps">
                <label for="">Confirm Password</label>
                <input type="text" name="cnfPass" id="" placeholder="Enter password again">
                <span class="confirm-pass"></span>
            </div>

            <input id="sub" type="submit" placeholder="Submit">
        </form>
    </div>

    <script src="homework1.js">

    </script>
</body>
</html>
